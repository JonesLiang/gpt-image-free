name: release

# 推送形如 v0.1.0 的 tag 时触发多平台构建并发布 Release。
# 客户端通过 api.github.com 查最新 release，走 gh-proxy 镜像下载安装包。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先在 Ubuntu 上跑单元测试，失败就不打包
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macos-x64
          - platform: ubuntu-22.04
            args: ""
            name: linux-x64
          - platform: windows-latest
            args: ""
            name: windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      # Intel Mac 需要额外装 x86_64 目标；其它平台用默认目标即可
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.name == 'macos-x64'
        with:
          targets: x86_64-apple-darwin
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.name != 'macos-x64'

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: 构建并上传
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "."
          tagName: ${{ github.ref_name }}
          releaseName: "v${{ github.ref_name }}"
          releaseBody: |
            GPT Image Free ${{ github.ref_name }}

            - macOS：*_aarch64.dmg（Apple 芯片）/ *_x64.dmg（Intel）
            - Windows：*_x64_zh-CN.msi
            - Linux：*_amd64.AppImage

            国内下载慢可把链接前缀替换为 https://gh-proxy.com/
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 所有平台都构建完成后，把版本号写回 Cargo.toml，方便下次发版跟随
  verify:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 确认产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --json assets \
            --jq '.assets[].name'
