name: release

# 推动形如 v0.1.0 的 tag 时触发多平台构建并发布 Release。
# 客户端通过 github.com/.../releases/latest 的跳转查最新版本（不占 API 配额），
# 走 gh-proxy 镜像下载安装包。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 同一 tag 重复触发时，取消上一次，避免两个构建抢着往同一个 Release 传文件。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # 单元测试和打包并行跑，不再串行等待。
  # 测试只编译 std + 几个纯逻辑 crate，用不着 WebKit，所以不放 Linux 上。
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: test
          # 测试只用 debug 产物，缓存 debug 就够了。
          cache-all-crates: true
      - name: 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两个 macOS 目标合成一个 job：同一台 runner 编译两次，
          # 省掉一台机器的排队和 checkout，公共依赖只编一遍也可复用。
          - platform: macos-latest
            name: macos
            args: --target aarch64-apple-darwin --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            name: linux-x64
            args: ""
          - platform: windows-latest
            name: windows-x64
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 需要同时能编 arm64 和 x64
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.name }}

      - name: 构建并上传
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "."
          tagName: ${{ github.ref_name }}
          releaseName: "v${{ github.ref_name }}"
          releaseBody: |
            GPT Image Free ${{ github.ref_name }}

            - macOS：*_aarch64.dmg（Apple 芯片）/ *_x64.dmg（Intel）
            - Windows：*_x64-setup.exe（推荐）/ *_x64_en-US.msi
            - Linux：*_amd64.AppImage / *.deb

            国内下载慢可把链接前缀替换为 https://gh-proxy.com/
          releaseDraft: false
          prerelease: false
          # 安装包本身已经是压缩格式（dmg / AppImage / nsis / msi），
          # tauri 默认还会再压一遍 tar.gz 并算 SHA，对一个 4MB 的壳子纯属浪费。
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # 构建完成后再确认产物齐全，避免发一个空 Release。
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 确认产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name'
