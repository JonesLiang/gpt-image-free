<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPT Image Free</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- 头像 / 设置菜单：从会话侧栏底部（或设置页右上角）的头像弹出 -->
      <div class="menu" id="avatarMenu" role="menu" hidden>
        <div class="menu-head">
          <div class="menu-avatar" id="menuAvatar">L</div>
          <div class="menu-id">
            <div class="menu-name" id="menuName">ligang</div>
            <div class="menu-plan" id="menuPlan">本地客户端</div>
          </div>
        </div>
        <div class="menu-sep"></div>
        <button class="menu-item" data-route="overview" role="menuitem">
          <span class="mi-icon"></span><span>剩余额度</span>
        </button>
        <button class="menu-item" data-route="api" role="menuitem">
          <span class="mi-icon"></span><span>API 接入</span>
        </button>
        <button class="menu-item" data-route="import" role="menuitem">
          <span class="mi-icon"></span><span>高级导入</span>
        </button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-route="settings" role="menuitem">
          <span class="mi-icon"></span><span>插件设置</span>
        </button>
      </div>

      <main class="stage" id="stage"></main>

      <!-- 应用内更新提示条 -->
      <div class="update-bar" id="updateBar" hidden>
        <span class="update-pulse"></span>
        <div class="update-copy">
          <strong id="updateTitle"></strong>
          <span id="updateDesc"></span>
        </div>
        <button class="btn" id="updateLater" hidden>稍后</button>
        <button class="btn primary" id="updateAction" hidden>立即更新</button>
      </div>

      <!-- 全局图片查看器 -->
      <div class="lightbox" id="lightbox" hidden>
        <div class="lightbox-inner" id="lightboxInner">
          <img id="lightboxImg" alt="" draggable="false" />
        </div>
        <div class="lightbox-toolbar">
          <span class="lightbox-tip">滚轮缩放 · 放大后滚动平移 · 双击复位 · Esc 关闭</span>
          <button id="lightboxZoomOut" title="缩小">−</button>
          <button id="lightboxFit" title="适应窗口">适应</button>
          <button id="lightboxZoomIn" title="放大">+</button>
          <a id="lightboxDownload" download="image.png" title="下载图片">下载</a>
        </div>
        <button class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
      </div>

      <div class="toast" id="toast" hidden></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
