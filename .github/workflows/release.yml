name: release

# 只做 Windows + macOS，Linux 暂不出包。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 不设 concurrency：取消一个 run 会连带取消同组正在跑的 run，
# 之前就因此误杀过正在构建的任务。宁可并存也别互相打断。

jobs:
  # ── 单元测试：macOS 跑，与构建并行，失败不挡出包 ──────────────
  test:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # ── 三份产物并行编译 ──────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            name: macos-x64
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            name: windows-x64
            target: ""
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != ''
        with:
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == ''

      # 缓存是快慢的分水岭：首次约 3 分钟，之后命中缓存约 1 分钟。
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.name }}

      - name: 编译打包
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2 build \
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }} \
            --bundles ${{ matrix.bundles }}

      # 关键：这是 cargo workspace，产物在仓库根的 target/，
      # 不在 src-tauri/target/。之前写错路径导致编译成功却收集失败。
      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          find target -type f \( -name '*.dmg' -o -name '*setup.exe' \) -exec cp {} dist/ \;
          echo "--- 收集到："
          ls -la dist
          test -n "$(ls -A dist)" || { echo "没有找到任何安装包，产物路径可能又不对"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  # ── 收齐后一次性发布 ─────────────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            GPT Image Free ${{ github.ref_name }}

            - macOS：*_aarch64.dmg（Apple 芯片）/ *_x64.dmg（Intel）
            - Windows：*_x64-setup.exe

            国内下载慢可把链接前缀替换为 https://gh-proxy.com/
          files: artifacts/*
          fail_on_unmatched_files: true
