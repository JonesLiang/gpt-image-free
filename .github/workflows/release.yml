name: release

# 只做 Windows + macOS。Linux 暂时不出包，原因：
#   1) 构建环境最重（要装整套 WebKitGTK，apt 一步就 1-2 分钟）
#   2) 校验最不可靠（linuxdeploy 在部分发行版上失败率偏高）
# 需要时把 linux job 加回来即可。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── 单元测试：独立并行，挂了不阻塞出包 ─────────────────────────
  test:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # ── 三份产物并行编译 ──────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            # 只出 dmg，不出 app.tar.gz：安装包本身已压缩，不必再压一遍
            bundles: dmg
          - os: macos-latest
            name: macos-x64
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            name: windows-x64
            target: ""
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != ''
        with:
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == ''

      # 缓存是快慢的分水岭：首次冷启动约 3 分钟，之后命中缓存约 1 分钟。
      # shared-key 让 mac 双架构共用同一份依赖缓存。
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.name }}

      - name: 编译打包
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2 build \
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }} \
            --bundles ${{ matrix.bundles }}

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*setup.exe' \) -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  # ── 收齐后一次性发布，不与 build 抢权限 ───────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ github.ref_name }}
          body: |
            GPT Image Free ${{ github.ref_name }}

            - macOS：*_aarch64.dmg（Apple 芯片）/ *_x64.dmg（Intel）
            - Windows：*_x64-setup.exe

            国内下载慢可把链接前缀替换为 https://gh-proxy.com/
          files: artifacts/*
          fail_on_unmatched_files: true
