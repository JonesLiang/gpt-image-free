name: release

# 推动形如 v0.1.0 的 tag 时触发多平台构建并发布 Release。
# 客户端通过 github.com/.../releases/latest 的跳转查最新版本（不占 API 配额），
# 走 gh-proxy 镜像下载安装包。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 同一 tag 重复触发时取消上一次，避免两个构建抢着往同一个 Release 传文件。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # 单元测试和打包并行，互不阻塞：测试挂了靠红灯提醒，不拖慢发版。
  # 测试只编译 std + 几个纯逻辑 crate，用不着 WebKit，所以不放 Linux 上。
  test:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: test
          cache-all-crates: true
      - name: 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # 每个平台只负责编译和打包，产物当 artifact 传走。
  # 不在这里碰 Release：tauri-action 一旦碰 Release 就会要求有创建权限，
  # 而 Actions 的 GITHUB_TOKEN 在这类事件下经常拿不到，反而把整个 job 带崩。
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
          - platform: macos-latest
            name: macos-x64
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            name: linux-x64
            target: ""
          - platform: windows-latest
            name: windows-x64
            target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != ''
        with:
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == ''

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.name }}

      - name: 编译并打包
        run: |
          npx --yes @tauri-apps/cli@2 build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: 收集安装包
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # 所有平台都出包后，一次性建 Release 并上传，避免并发抢同一个 Release。
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ github.ref_name }}
          # 已存在的 Release 就地更新，不重复创建
          generate_release_notes: false
          body: |
            GPT Image Free ${{ github.ref_name }}

            - macOS：*_aarch64.dmg（Apple 芯片）/ *_x64.dmg（Intel）
            - Windows：*_x64-setup.exe（推荐）/ *_x64_en-US.msi
            - Linux：*_amd64.AppImage / *.deb

            国内下载慢可把链接前缀替换为 https://gh-proxy.com/
          files: artifacts/*
          fail_on_unmatched_files: true
