name: ci

# 手动触发的一次性构建（不打包、不发布），用途只有两个：
#   1. 把 rust-cache 暖起来，之后发版能命中增量缓存；
#   2. 发版前先确认三个平台都编得过。
on:
  # 只手动触发：平时推 main 不会额外跑一遍三平台构建。
  # 准备发版前，在 Actions 页面点一次 Run workflow 把缓存暖起来即可。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            name: linux-x64
            args: ""
          - platform: windows-latest
            name: windows-x64
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux 系统依赖
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      # 和 release.yml 用同一个 shared-key，两边共用缓存
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.name }}
      - name: 编译检查
        run: cargo build --release --manifest-path src-tauri/Cargo.toml ${{ matrix.args }}
