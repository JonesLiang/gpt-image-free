[package]
name = "gpt-image-free"
version = "0.1.1"
edition = "2021"
rust-version = "1.77"
description = "GPT Image Free — a fast, Codex-styled desktop client for the local chatgpt2api account pool"
license = "MIT"
repository = "https://github.com/JonesLiang/gpt-image-free"

[lib]
name = "gpt_image_free"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
base64 = "0.22"
sha2 = "0.10"
directories = "5"
